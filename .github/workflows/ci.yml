name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check src tests scripts apps
      - name: Format check
        run: uv run ruff format --check src tests scripts apps
      - name: Type check
        run: uv run mypy src apps
      - name: Routing evaluation harness
        run: uv run python scripts/evaluate_routing.py
      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Type check
        run: bun run tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
